<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>じゃんけん</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./judge.js" defer></script>
  <script src="./game.js" defer></script>
</head>
<body>
  <main>
    <h1>じゃんけん</h1>
    <p>好きな手を選んでね。</p>
    <div class="hands" aria-label="出す手">
      <button type="button" data-hand="0"><span aria-hidden="true">✊</span>グー</button>
      <button type="button" data-hand="1"><span aria-hidden="true">✌️</span>チョキ</button>
      <button type="button" data-hand="2"><span aria-hidden="true">✋</span>パー</button>
    </div>
    <section class="result" aria-live="polite" aria-atomic="true" aria-label="勝負の結果">
      <p id="match">あなたとコンピュータの手がここに出ます。</p>
      <p id="result">じゃんけん、ぽん！</p>
      <p id="score">0勝 / 0敗 / 0あいこ（0回）</p>
    </section>
    <p class="note">成績はページを開いている間だけ記録されます。</p>
  </main>
</body>
</html>
